<!DOCTYPE html>
<!-- @dsCard group="Brand" name="Background Gradients" subtitle="M3 tonal radial gradient — desktop · tablet · mobile · dark" viewport="700x120" -->
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500&display=swap" rel="stylesheet">
<style>
  body { margin: 0; padding: 16px 20px; font-family: 'Roboto', sans-serif; background: #FFF8F6; color: #211A1B; }
  .section-title { font-size: 10px; font-weight: 500; text-transform: uppercase; letter-spacing: .06em; color: #524344; margin-bottom: 8px; }
  .row { display: flex; gap: 10px; }
  .swatch { flex: 1; min-height: 80px; border-radius: 16px; display: flex; align-items: flex-end; padding: 8px 10px; position: relative; overflow: hidden; }
  .label { font-size: 10px; font-weight: 500; padding: 3px 7px; border-radius: 4px; background: rgba(0,0,0,.15); color: #fff; backdrop-filter: blur(4px); }
</style>
</head><body>
  <div class="section-title">M3 Backdrop — Tonal Surface Radial Gradient</div>
  <div class="row">
    <div class="swatch" style="background: radial-gradient(ellipse 120% 60% at 15% -5%, #FFD9DC 0%, #FFF8F6 55%);">
      <span class="label" style="color:#3B0017;background:rgba(255,255,255,.5);">Desktop</span>
    </div>
    <div class="swatch" style="background: radial-gradient(ellipse 140% 50% at 50% -5%, #FFD9DC, #FFF8F6 60%);">
      <span class="label" style="color:#3B0017;background:rgba(255,255,255,.5);">Tablet</span>
    </div>
    <div class="swatch" style="background: radial-gradient(ellipse 160% 40% at 50% -10%, #FFD9DC, #FFF8F6 60%);">
      <span class="label" style="color:#3B0017;background:rgba(255,255,255,.5);">Mobile</span>
    </div>
    <div class="swatch" style="background: radial-gradient(ellipse 120% 60% at 15% -5%, #723340 0%, #191112 60%);">
      <span class="label">Dark mode</span>
    </div>
  </div>
</body></html>
