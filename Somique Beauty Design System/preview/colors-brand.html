<!DOCTYPE html>
<!-- @dsCard group="Colors" name="Brand Colors" subtitle="M3 tonal palette: Primary · Secondary · Tertiary with on-colors" viewport="700x160" -->
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500&display=swap" rel="stylesheet">
<style>
  body { margin: 0; padding: 20px; font-family: 'Roboto', sans-serif; background: #FFF8F6; }
  .row { display: flex; gap: 10px; flex-wrap: wrap; }
  .swatch { border-radius: 12px; overflow: hidden; flex: 1; min-width: 90px; box-shadow: 0 1px 3px rgba(0,0,0,.1); }
  .swatch-color { height: 80px; display: flex; align-items: flex-end; padding: 6px 8px; }
  .swatch-info { padding: 8px 10px; }
  .swatch-name { font-size: 11px; font-weight: 500; color: #211A1B; }
  .swatch-hex  { font-size: 10px; color: #524344; font-family: monospace; margin-top: 1px; }
  .swatch-tone { font-size: 10px; color: #857374; margin-top: 2px; }
  .on-label { font-size: 9px; font-weight: 500; padding: 2px 5px; border-radius: 4px; }
</style>
</head><body>
<div class="row">
  <div class="swatch" style="background:#FFF0F1;">

  <div class="swatch" style="background:#FFF0F1;">

    </div>
    <div class="swatch-info"><div class="swatch-name">Secondary</div><div class="swatch-hex">#7C5A47</div><div class="swatch-tone">Warm Sienna</div></div>
  </div>
  <div class="swatch" style="background:#FFF0F1;">
