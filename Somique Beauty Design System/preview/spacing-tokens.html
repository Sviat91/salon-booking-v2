<!DOCTYPE html>
<!-- @dsCard group="Spacing" name="Spacing & Radius" subtitle="8dp grid · M3 shape scale: xs/sm/md/lg/xl/full" viewport="700x220" -->
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500&display=swap" rel="stylesheet">
<style>
  body { margin: 0; padding: 16px 20px; font-family: 'Roboto', sans-serif; background: #FFF8F6; color: #211A1B; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
  .section-title { font-size: 10px; font-weight: 500; text-transform: uppercase; letter-spacing: .06em; color: #524344; margin-bottom: 10px; }
  .sp-row { display: flex; align-items: center; gap: 10px; margin-bottom: 5px; }
  .sp-bar { background: #8B4A58; border-radius: 2px; height: 8px; }
  .sp-label { font-size: 10px; color: #524344; font-family: monospace; min-width: 80px; }
  .shape-row { display: flex; align-items: center; gap: 10px; margin-bottom: 7px; }
  .shape-box { width: 48px; height: 32px; background: #FFD9DC; border: 1.5px solid #D8C2C3; }
  .shape-label { font-size: 10px; color: #524344; font-family: monospace; }
</style>
</head><body>
<div class="grid">
  <div>
    <div class="section-title">8dp Spacing Grid</div>
    <div class="sp-row"><div class="sp-bar" style="width:4px;"></div><div class="sp-label">4px (1)</div></div>
    <div class="sp-row"><div class="sp-bar" style="width:8px;"></div><div class="sp-label">8px (2)</div></div>
    <div class="sp-row"><div class="sp-bar" style="width:12px;"></div><div class="sp-label">12px (3)</div></div>
    <div class="sp-row"><div class="sp-bar" style="width:16px;"></div><div class="sp-label">16px (4)</div></div>
    <div class="sp-row"><div class="sp-bar" style="width:24px;"></div><div class="sp-label">24px (6)</div></div>
    <div class="sp-row"><div class="sp-bar" style="width:32px;"></div><div class="sp-label">32px (8)</div></div>
    <div class="sp-row"><div class="sp-bar" style="width:40px;"></div><div class="sp-label">40px (10)</div></div>
    <div class="sp-row"><div class="sp-bar" style="width:56px;"></div><div class="sp-label">56px (14)</div></div>
  </div>
  <div>
    <div class="section-title">M3 Shape Scale</div>
    <div class="shape-row"><div class="shape-box" style="border-radius:4px;"></div><div class="shape-label">xs · 4px · chips</div></div>
    <div class="shape-row"><div class="shape-box" style="border-radius:8px;"></div><div class="shape-label">sm · 8px · menus</div></div>
    <div class="shape-row"><div class="shape-box" style="border-radius:12px;"></div><div class="shape-label">md · 12px · cards</div></div>
    <div class="shape-row"><div class="shape-box" style="border-radius:16px;"></div><div class="shape-label">lg · 16px · drawers</div></div>
    <div class="shape-row"><div class="shape-box" style="border-radius:28px;"></div><div class="shape-label">xl · 28px · FAB · dialogs</div></div>
    <div class="shape-row"><div class="shape-box" style="border-radius:9999px;"></div><div class="shape-label">full · buttons · pills</div></div>
  </div>
</div>
</body></html>
