const { useState, useEffect, useContext, createContext } = React;

    card:    '#FFFFFF', surface:'#F9E9EA', surfHi:'#F3E3E4',

    secCont: '#FFDCCA', onSecCont:'#2F1509', input:'#EDE1E1', outline:'#D8C2C3',
    shadow:  '0 1px 3px rgba(0,0,0,.07)', shadow2:'0 2px 10px rgba(0,0,0,.1)',
    success: '#21A67A', sucCont:'#B7F2DC', onSucc:'#002117',
    err:     '#BA1A1A', errCont:'#FFDAD6', onErr:'#410002',

    primary: '#FFB2B8', priCont:'#723340', onPri:'#3B0017', onPriCont:'#FFD9DC',
    secCont: '#634432', onSecCont:'#FFDCCA', input:'#3A2820', outline:'#5A3828',
    shadow:  '0 2px 8px rgba(0,0,0,.3)', shadow2:'0 4px 16px rgba(0,0,0,.4)',
    success: '#6EDDAC', sucCont:'#003824', onSucc:'#6EDDAC',
    err:     '#FFB4AB', errCont:'#93000A', onErr:'#FFB4AB',
    navActive:'rgba(255,178,184,.15)', navActiveTxt:'#FFB2B8',
    navHov:  'rgba(255,178,184,.07)', navHovTxt:'#FFEEE8',
  },
};
const ThCtx = createContext({ dark:false, toggle:()=>{}, t:AT.light });
const useTh = () => useContext(ThCtx);

function ThProvider({ children }) {
  const [dark, setDark] = useState(() => { try { return localStorage.getItem('admin-theme')==='dark'; } catch { return false; }});
  useEffect(() => { try { localStorage.setItem('admin-theme', dark?'dark':'light'); } catch {} }, [dark]);
  return <ThCtx.Provider value={{ dark, toggle:()=>setDark(d=>!d), t:dark?AT.dark:AT.light }}>{children}</ThCtx.Provider>;
}

  menu:      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>,
  sun:       <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></svg>,
  moon:      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>,
  plus:      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>,

// ── SIDEBAR ───────────────────────────────────────────────
function Sidebar({ open, page, onNav, onToggle }) {
  const { t, dark, toggle } = useTh();
  const W = open ? 240 : 72;

  const navItem = ({ id, label, icon }) => {
    const active = page === id;
    return (
      <button key={id} onClick={() => onNav(id)} title={!open ? label : ''} style={{
        width:'100%', display:'flex', alignItems:'center', gap:12,
        padding: open ? '10px 14px' : '10px 0', justifyContent: open ? 'flex-start' : 'center',
        borderRadius:10, border:'none', cursor:'pointer',
        background: active ? t.navActive : 'transparent',
        color: active ? t.navActiveTxt : t.textSub,
        fontWeight: active ? 500 : 400, fontSize:14,
        transition:'all 150ms', position:'relative', overflow:'hidden',
      }}>
        <span style={{ flexShrink:0, display:'flex', alignItems:'center', justifyContent:'center', width:22, color:'inherit' }}>{IC[icon]}</span>
        {open && <span style={{ overflow:'hidden', whiteSpace:'nowrap', transition:'opacity 200ms', opacity: open?1:0 }}>{label}</span>}
        {open && active && <svg style={{ marginLeft:'auto', flexShrink:0 }} width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5"><polyline points="9 18 15 12 9 6"/></svg>}
      </button>
    );
  };

  return (
    <aside style={{
      width:W, minHeight:'100vh', display:'flex', flexDirection:'column',
      background:t.sidebar, borderRight:`1px solid ${t.border}`, flexShrink:0,
      transition:'width 200ms cubic-bezier(0.2,0,0,1)', overflow:'hidden',
    }}>
      {/* Header */}
      <div style={{ height:64, display:'flex', alignItems:'center', justifyContent: open?'space-between':'center', padding: open?'0 14px 0 16px':'0', borderBottom:`1px solid ${t.border}`, flexShrink:0 }}>
        {open && (
          <div style={{ display:'flex', alignItems:'center', gap:10, minWidth:0 }}>
            <div style={{ width:28, height:28, borderRadius:8, background:t.priCont, display:'flex', alignItems:'center', justifyContent:'center', color:t.onPriCont, flexShrink:0 }}>
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><circle cx="6" cy="6" r="3"/><circle cx="6" cy="18" r="3"/><line x1="20" y1="4" x2="8.12" y2="15.88"/><line x1="14.47" y1="14.48" x2="20" y2="20"/><line x1="8.12" y1="8.12" x2="12" y2="12"/></svg>
            </div>
            <span style={{ fontSize:13, fontWeight:500, color:t.text, overflow:'hidden', textOverflow:'ellipsis', whiteSpace:'nowrap' }}>Somique Beauty</span>
          </div>
        )}
        <button onClick={onToggle} style={{ width:32, height:32, borderRadius:8, border:'none', background:'transparent', cursor:'pointer', color:t.textSub, display:'flex', alignItems:'center', justifyContent:'center', flexShrink:0 }}>{IC.menu}</button>
      </div>

      {/* Nav */}
      <nav style={{ flex:1, padding: open?'12px 10px':'12px 8px', overflowY:'auto', display:'flex', flexDirection:'column', gap:2 }}>
        {NAV.map(navItem)}
        <div style={{ height:1, background:t.border, margin:'8px 4px' }}></div>
        <button onClick={() => onNav('site')} title={!open?'Back to site':''} style={{ width:'100%', display:'flex', alignItems:'center', gap:12, padding: open?'10px 14px':'10px 0', justifyContent: open?'flex-start':'center', borderRadius:10, border:'none', cursor:'pointer', background:'transparent', color:t.textSub, fontSize:14, transition:'all 150ms' }}>
          <span style={{ flexShrink:0, display:'flex', alignItems:'center', justifyContent:'center', width:22 }}>{IC.back}</span>
          {open && <span>Back to site</span>}
        </button>
      </nav>

      {/* Footer */}
      <div style={{ borderTop:`1px solid ${t.border}`, padding: open?'10px':'8px', display:'flex', flexDirection:'column', gap:6 }}>
        {open ? (
          <div style={{ display:'flex', gap:8, alignItems:'center' }}>
            <div style={{ flex:1, background:t.surface, borderRadius:8, padding:'6px 10px', minWidth:0 }}>
              <div style={{ fontSize:12, fontWeight:500, color:t.text, overflow:'hidden', textOverflow:'ellipsis', whiteSpace:'nowrap' }}>admin@somique.beauty</div>
              <div style={{ fontSize:11, color:t.textMut }}>SUPERADMIN</div>
            </div>
            <button onClick={toggle} style={{ width:30, height:30, borderRadius:8, border:`1px solid ${t.outline}`, background:'transparent', cursor:'pointer', color:t.textSub, display:'flex', alignItems:'center', justifyContent:'center' }}>{dark ? IC.sun : IC.moon}</button>
          </div>
        ) : (
          <button onClick={toggle} style={{ width:'100%', height:32, borderRadius:8, border:`1px solid ${t.outline}`, background:'transparent', cursor:'pointer', color:t.textSub, display:'flex', alignItems:'center', justifyContent:'center' }}>{dark ? IC.sun : IC.moon}</button>
        )}
        <button style={{ display:'flex', alignItems:'center', gap:8, justifyContent: open?'flex-start':'center', padding: open?'6px 10px':'6px 0', borderRadius:8, border:'none', cursor:'pointer', background:'transparent', color:t.textSub, fontSize:12 }}>
          {IC.logout}{open && 'Sign Out'}
        </button>
      </div>
    </aside>
  );
}

// ── TOP APP BAR ───────────────────────────────────────────
function TopBar({ pageTitle }) {
  const { t } = useTh();
  return (
    <div style={{ height:64, display:'flex', alignItems:'center', justifyContent:'space-between', padding:'0 24px', background:t.nav, borderBottom:`1px solid ${t.border}`, flexShrink:0, backdropFilter:'blur(8px)' }}>

];

  pending:   { bg:'#FFDFA3', color:'#271900', dot:'#7A5900' },
  cancelled: { bg:'#FFDAD6', color:'#410002', dot:'#BA1A1A' },

  const { t } = useTh();

    { label:"Today's bookings", val:'5',     sub:'2 masters active',  cont:'#FFD9DC', valC:'#3B0017' },
    { label:'This week',        val:'23',    sub:'+4 vs last week',   cont:'#FFDCCA', valC:'#2F1509' },

        <div style={{ display:'flex', gap:8 }}>
          {['All','Olga','Yuliia'].map(m => (
            <button key={m} onClick={()=>setMaster(m)} style={{ height:32, padding:'0 14px', borderRadius:8, fontFamily:'inherit', fontSize:12, fontWeight:500, cursor:'pointer', border:master===m?'none':`1px solid ${t.outline}`, background:master===m?t.priCont:'transparent', color:master===m?t.onPriCont:t.textSub, transition:'all 150ms' }}>{m}</button>
          ))}
          <button style={{ height:36, padding:'0 18px', borderRadius:9999, border:'none', background:t.primary, color:t.onPri, fontSize:13, fontWeight:500, cursor:'pointer', display:'flex', alignItems:'center', gap:6 }}>{IC.plus} New</button>
        </div>
      </div>
      <div style={{ flex:1, background:t.card, borderRadius:16, overflow:'hidden', border:`1px solid ${t.border}`, boxShadow:t.shadow, display:'flex', flexDirection:'column' }}>
        {/* Day headers */}
        <div style={{ display:'grid', gridTemplateColumns:'56px repeat(7,1fr)', borderBottom:`1px solid ${t.border}`, background:t.surface, flexShrink:0 }}>
          <div style={{ borderRight:`1px solid ${t.border}` }}></div>
          {CAL_DAYS_H.map((d,i) => {
            const isToday = i===3;
            return (
              <div key={i} style={{ padding:'10px 4px', textAlign:'center', borderRight:i<6?`1px solid ${t.border}`:'none' }}>
                <div style={{ fontSize:9, fontWeight:500, color:isToday?t.primary:t.textMut, textTransform:'uppercase', letterSpacing:'.06em' }}>{d.split(' ')[0]}</div>
                <div style={{ width:26, height:26, borderRadius:'50%', background:isToday?t.primary:'transparent', color:isToday?t.onPri:t.text, fontSize:13, fontWeight:isToday?500:400, display:'flex', alignItems:'center', justifyContent:'center', margin:'4px auto 0' }}>{d.split(' ')[1]}</div>
              </div>
            );
          })}
        </div>
        {/* Body */}
        <div style={{ flex:1, overflowY:'auto', position:'relative' }}>
          {CAL_HOURS.map((h,hi) => (
            <div key={h} style={{ display:'grid', gridTemplateColumns:'56px repeat(7,1fr)', height:CELL_H, borderBottom:hi<CAL_HOURS.length-1?`1px solid ${t.border}`:'none' }}>
              <div style={{ borderRight:`1px solid ${t.border}`, padding:'4px 8px', fontSize:10, color:t.textMut, textAlign:'right', paddingTop:6 }}>{h}</div>
              {CAL_DAYS_H.map((_,di) => <div key={di} style={{ borderRight:di<6?`1px solid ${t.border}`:'none', background:di===3?`${t.primary}06`:'transparent' }}></div>)}
            </div>
          ))}
          {evts.map((ev,i) => (
            <div key={i} style={{
              position:'absolute',
              top:(ev.startH-START_H)*CELL_H+2,
              left:`calc(56px + ${ev.day}*(100% - 56px)/7 + 4px)`,
              width:`calc((100% - 56px)/7 - 8px)`,
              height:ev.dur*CELL_H-4,
              background:ev.bg, borderRadius:8, padding:'5px 7px',
              overflow:'hidden', cursor:'pointer',
              borderLeft:`3px solid ${ev.border}`,
              transition:'filter 150ms',
            }}
            onMouseEnter={e=>e.currentTarget.style.filter='brightness(.94)'}
            onMouseLeave={e=>e.currentTarget.style.filter='none'}>
              <div style={{ fontSize:11, fontWeight:600, color:'#211A1B', overflow:'hidden', textOverflow:'ellipsis', whiteSpace:'nowrap' }}>{ev.name}</div>
              <div style={{ fontSize:10, color:'rgba(33,26,27,.65)', marginTop:1 }}>{ev.svc}</div>
            </div>
          ))}
        </div>
      </div>
    </div>
  );
}

// ── ADMIN APP ─────────────────────────────────────────────
function AdminApp() {
  const [page,   setPage]   = useState('dashboard');
  const [sideOpen, setSideOpen] = useState(true);

  const [PageComp, pageTitle] = PAGES[page] || [() => <PlaceholderPage title={page} desc="" />, page];

  return (
    <ThProvider>
      <AdminInner page={page} setPage={setPage} sideOpen={sideOpen} setSideOpen={setSideOpen} PageComp={PageComp} pageTitle={pageTitle} />
    </ThProvider>
  );
}

function AdminInner({ page, setPage, sideOpen, setSideOpen, PageComp, pageTitle }) {
  const { t } = useTh();
  return (
    <div style={{ display:'flex', height:'100vh', overflow:'hidden', background:t.bg }}>
      <Sidebar open={sideOpen} page={page} onNav={setPage} onToggle={() => setSideOpen(o => !o)} />
      <div style={{ flex:1, display:'flex', flexDirection:'column', overflow:'hidden' }}>
        <TopBar pageTitle={pageTitle} />
        <main style={{ flex:1, overflowY:'auto' }}>
          <PageComp />
        </main>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<AdminApp />);
