<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <title>Loom & Blade — demo</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap"
      rel="stylesheet"
    />
    <script>
      (function () {
        // Demo defaults to dark unless the visitor explicitly picked light
        // via ThemeToggle (ported from the real layout.tsx pattern, but the
        // no-saved-preference fallback is dark here, not system preference —
        // this is a dark-branded demo site, not a real tenant).
        try {
          var saved = localStorage.getItem('theme')
          if (saved !== 'light') {
            document.documentElement.classList.add('dark')
          }
        } catch (e) {}
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
